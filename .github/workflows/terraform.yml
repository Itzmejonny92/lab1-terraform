name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: [lint, security, validate]
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_student_id: ${{ vars.STUDENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Plan
        run: terraform plan

  apply:
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_student_id: ${{ vars.STUDENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Import existing resources into ephemeral state
        shell: bash
        run: |
          terraform import "google_compute_instance.vm" \
            "projects/${TF_VAR_project_id}/zones/${TF_VAR_region}-a/instances/${TF_VAR_student_id}-lab1-vm" || true
          terraform import "google_compute_resource_policy.daily_backup" \
            "projects/${TF_VAR_project_id}/regions/${TF_VAR_region}/resourcePolicies/${TF_VAR_student_id}-daily-backup" || true
          terraform import "google_compute_disk_resource_policy_attachment.backup_attachment" \
            "${TF_VAR_project_id}/${TF_VAR_region}-a/${TF_VAR_student_id}-lab1-vm/${TF_VAR_student_id}-daily-backup" || true
      - name: Terraform Apply
        run: terraform apply -auto-approve
